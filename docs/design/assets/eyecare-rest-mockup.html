<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休息时刻 · 视觉稿</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #0d1526 0%, #060a14 45%, #000000 100%);
    color: #f5f5f7;
    display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
  }
  /* 缓慢呼吸的冷色光晕：唯一动效 */
  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(42% 30% at 50% 38%, rgba(56, 132, 255, 0.10), transparent 70%);
    animation: breathe 24s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.12); }
  }
  .stage { position: relative; text-align: center; padding: 0 6vw; }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.22em;
    color: #6e6e73; text-transform: uppercase; margin-bottom: 28px;
  }
  h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 10px; }
  .sub { font-size: 16px; color: #98989d; margin-bottom: 64px; }
  .countdown {
    font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: clamp(96px, 13vw, 168px); line-height: 1; letter-spacing: -0.04em;
    background: linear-gradient(180deg, #e8f2ff 0%, #7dd3fc 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 56px;
  }
  .progress {
    width: min(420px, 60vw); height: 6px; margin: 0 auto 40px;
    border-radius: 999px; background: rgba(255,255,255,0.10); overflow: hidden;
  }
  .progress > span {
    display: block; height: 100%; width: 62%; border-radius: inherit;
    background: linear-gradient(90deg, #0a84ff, #64d2ff);
  }
  .hint { font-size: 12px; color: #6e6e73; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <main class="stage">
    <div class="eyebrow">Eye Review · 护眼休息</div>
    <h1>休息一下，看看远处</h1>
    <p class="sub">双眼放松 20 秒，眺望 6 米以外</p>
    <div class="countdown">04:32</div>
    <div class="progress"><span></span></div>
    <div class="hint">按住 Ctrl + Alt + Shift + F12 五秒可紧急退出</div>
  </main>
</body>
</html>
