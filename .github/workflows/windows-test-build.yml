name: Windows Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows 编译、测试与安装包
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: node --test

      - name: Build frontend assets
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Verify installer
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER="$(find target -type f -path '*/release/bundle/nsis/*.exe' | sort | head -n 1 || true)"
          if [[ -z "$INSTALLER" ]]; then
            echo "Windows NSIS installer not found" >&2
            find target -type f -path '*/bundle/*' 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          echo "installer=$INSTALLER"

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: eye-care-windows-test-${{ github.sha }}
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 7
